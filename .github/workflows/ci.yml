name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.18.0"

jobs:
  quality:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  database:
    name: Tenant isolation (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # The image may bootstrap as supabase_admin or postgres depending on the runtime.
      # The suite needs SET ROLE app_user, so ensure the role exists with those attributes.
      - name: Ensure postgres role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -c \
            "do \$\$ begin
               if exists (select 1 from pg_roles where rolname = 'postgres') then
                 alter role postgres with login superuser password 'postgres';
               else
                 create role postgres login superuser password 'postgres';
               end if;
             end \$\$;"

      - name: Apply migrations and run pgTAP
        run: scripts/run-pgtap.sh "postgres://postgres:postgres@localhost:5432/postgres"

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on any production dependency that is not Apache-2.0 compatible.
      - name: Check licenses
        run: pnpm check:licenses

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Placeholder until Playwright and axe-core land with the test-infrastructure item.
      # It must stay a required check so accessibility is never silently skipped.
      - name: Run axe suite
        run: pnpm run --if-present test:a11y

  commits:
    name: Commit conventions and DCO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Conventional Commits
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: DCO sign-off
        run: >
          node scripts/check-dco.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

      # Code scanning needs Advanced Security, which private repositories do not have.
      # This activates automatically when the project is made public.
      - name: Initialize CodeQL
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        if: github.event.repository.visibility == 'public'
        uses: github/codeql-action/analyze@v3

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the CLI directly rather than the action, which requires API write access to
      # post comments and fails on repositories without that permission.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir /repo --redact --no-banner --exit-code 1
